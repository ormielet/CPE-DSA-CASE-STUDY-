<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack (Parking Garage) — DSA-CPE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../css/landing-page.css">
  <link rel="stylesheet" href="../css/stack.css">
</head>
<body data-base="../" data-mode="stack">
<!-- insert js -->

<main class="wrap">

  <div class="module-bar">
    <a class="back-btn" href="landing-page.html#menu">← BACK</a>
    <div>
      <h1 class="module-title"> <strong> STACK</strong> <em> (Parking Garage) </em></h1>
      <p class="module-sub">LIFO: last in, first out. Capacity: 10 cars.</p>
    </div>
  </div>

  <section class="info-row">
    <!-- stack picture -->
    <div class="photo-slot"><img src="../images/stack.png" alt="Stack (Parking Garage) illustration"></div>
    <div class="card">
      <h3>About this case study</h3>
      <!-- DESCRIPTION PLACEHOLDER (stack) -->
      <p> ---</p>
    </div>
  </section>

  <section class="sim-grid">
    <div class="stage-wrap">
      <div class="stage-head"><span class="live"><i></i>LIVE VIEW</span><span>Updates as you submit</span></div>
      <div class="stage" aria-live="polite">
        <div class="lot" id="lot"></div>
      </div>
    </div>
    <aside class="card panel">
      <div class="panel-head"><span>CONTROLS</span><span class="step">Enter data, then view the result</span></div>
      <form id="ctl" autocomplete="off">
        <label class="lbl" for="plate">Plate number</label>
        <input class="field" id="plate" placeholder="e.g. ABC123" maxlength="8" autocomplete="off">
        <div class="seg">
          <input type="radio" name="act" id="act-a" value="a" checked><label for="act-a">Arrival</label>
          <input type="radio" name="act" id="act-d" value="d"><label for="act-d">Departure</label>
        </div>
        <div class="btn-row"><button class="btn" type="submit">Submit</button></div>
      </form>
    
      <div class="out" id="out" hidden></div>
      <div class="rec" id="rec">
        <div class="rec-top">
          <span class="pill" id="occ">Occupied 0 / 10</span>
          <button class="btn ghost small" type="button" id="reset">Reset</button>
        </div>
        <h4 class="rec-title">Records</h4>
        <div class="rec-scroll">
          <table>
            <thead><tr><th>Plate</th><th>Arrivals</th><th>Departures</th><th>Status</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </aside>
  </section>
</main>
</body>
</html>
